services:
  - type: web
    name: omniforensics-ai
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: OMNIFORENSICS_DATA_DIR
        value: ./data
      - key: OMNIFORENSICS_MAX_UPLOAD_MB
        value: 100
      - key: OMNIFORENSICS_PUBLIC_MODE
        value: true
      - key: OMNIFORENSICS_CORS_ORIGINS
        value: https://codex-inn.github.io
      - key: OMNIFORENSICS_USERNAME
        generateValue: true
      - key: OMNIFORENSICS_PASSWORD
        generateValue: true
